name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Verify public machine-readable surfaces
        run: |
          test -s dist/agents/manifest.json
          test -s dist/agents/manifest.schema.json
          test -s dist/llms.txt
          test -s dist/AGENTS.md
          node -e "JSON.parse(require('fs').readFileSync('dist/agents/manifest.json', 'utf8')); JSON.parse(require('fs').readFileSync('dist/agents/manifest.schema.json', 'utf8'))"
      - name: Verify GEO Audit v2 contract
        run: |
          node --check scripts/geo-audit.mjs
          npm run validate:geo-audit
